[package]
name = "pepper-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Pepper worker runtime for Rust capabilities"
license = "MIT"
repository = "https://github.com/agberohq/pepper"

[lib]
name = "pepper_runtime"
path = "src/lib.rs"

[[bin]]
name = "pepper-worker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
rmp-serde = "1"
memmap2 = "0.9"
libc = "0.2"
ed25519-dalek = "2"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
