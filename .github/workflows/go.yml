name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        go: ["1.25"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install msgpack

      - name: Install Rust (Linux)
        # The Rust capability test self-skips without cargo; install it on the
        # Linux job so the runtime is covered end to end.
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (Linux / macOS)
        if: runner.os != 'Windows'
        run: go test -count=1 -race -timeout 120s -cover ./...

      - name: Test (Windows)
        if: runner.os == 'Windows'
        # -race requires CGO which needs a C compiler on Windows.
        # Run without -race; the Linux job covers the race detector.
        run: go test -count=1 -timeout 120s -cover ./...

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m